[project]
name = "test-repaso-ia"
version = "0.1.0"
description = "Miniapp que genera tests de repaso desde apuntes (Practica UD1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

# Solo el backend es paquete Python (frontend/ es la SPA).
[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
